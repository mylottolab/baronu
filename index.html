<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A2BE0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="baronu_icon_192.png">
<link rel="apple-touch-icon" href="baronu_icon_192.png">
<title>바로너 — 한 사람과 바로 통하는 핫라인</title>
<link rel="stylesheet" href="nureum.css?v=20261105"><script src="baronu_i18n.js?v=20261105"></script>
<script src="alias_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="alias_common.js?v=20261105a"></script>
<script src="alias_qr.js?v=20261019a"></script>
<script src="nureum.js?v=20261101c"></script>
<script src="baronu_ads.js?v=20261103b" defer></script>
</head>
<body>
<!-- 바로너 첫 화면: 내 핫라인들. 핫라인 아이콘을 누르면 그 핫라인 화면, + 를 누르면 새 핫라인 -->
<div class="nu">
  <div class="nu-hero">
    <div class="nu-top">
      <svg class="nu-logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4c9.4 0 17 6.3 17 14.2S29.4 32.4 20 32.4c-1.6 0-3.1-.2-4.6-.5L7.6 36l1.6-7C5.5 26.4 3 22.5 3 18.2 3 10.3 10.6 4 20 4z" fill="#fff"/><text x="20" y="24" text-anchor="middle" font-size="14" font-weight="900" fill="#4A2BE0" font-family="sans-serif">너</text></svg>
      <h1>바로너</h1>
      <button class="nu-back" id="meBtn" type="button" aria-label="나 (설정)" title="나 (설정)" style="font-size:15px;font-weight:800">⚙ 나</button>
    </div>
    <p class="nu-sub">정한 한 사람과 바로 통하는 나만의 핫라인.<br>전화 · 영상 · 문자 · 사진, 서로 전화번호는 보이지 않아요.</p>
  </div>

  <div id="err" class="nu-err" role="alert"></div>
  <!-- 🔴 2026-11-01 — 가입 없이 쓰는 분께: 계정 지키기 권유(작게) -->
  <div id="anonCard" class="nu-note nu-hidden" style="display:flex;align-items:center;gap:10px">
    <span style="flex:1">이 휴대폰에서만 쓰는 계정이에요. 휴대폰을 바꿔도 남게 하려면 →</span>
    <button class="nu-btn line" id="anonProtect" type="button" style="height:40px;width:auto;flex:none;padding:0 12px;font-size:14px">계정 지키기</button>
  </div>
  <!-- 🔴 2026-11-01 — 바로너만 쓰다가 바로너(메신저)도 쓰고 싶을 때 -->
  
  <div id="grid" class="nu-grid" aria-live="polite"></div>
  <p id="empty" class="nu-sub nu-hidden" style="text-align:center;padding:18px 0">아직 핫라인이 없어요.<br>아래 [＋ 새 핫라인 만들기]로 소중한 한 사람을 이어 보세요.</p>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <a class="nu-btn" href="nureum_new.html">＋ 새 핫라인 만들기</a>
    <a class="nu-btn ghost" href="nureum_join.html">받은 코드 · QR로 짝 맺기</a>
    <button class="nu-btn line" id="scanCard" type="button">🖨 QR 카드 찍기</button>
    <div class="bn-ads-h">광고</div>
    <div class="bn-ads" data-n="2"></div>
    <p class="nu-foot">월 1,700원 · 12개월 16,500원 · <a href="terms.html">약관</a> · <a href="privacy.html">개인정보</a> · <a href="refund.html">환불</a></p>
  </div>
</div>

<script>
document.getElementById('meBtn').onclick = function(){ NU.meSheet(); };
/* 🔴 2026-11-01 — 냉장고 · 지갑 QR 카드 찍기 → 그 사람 화면 (짝 맺기 QR이면 짝 맺기로) */
document.getElementById('scanCard').onclick = async function(){
  try {
    var raw = await AL.openScanner(); if (!raw) return;
    var m = String(raw).match(/[?&]line=([0-9a-fA-F-]{36})/);
    if (m) { location.href = 'nureum_line.html?line=' + m[1].toLowerCase(); return; }
    var c = AL.codeFromScan(raw);
    if (c) { location.href = 'nureum_join.html?c=' + encodeURIComponent(c); return; }
    NU.showErr('err', '바로너 QR이 아니에요.');
  } catch (e) { NU.showErr('err', 'QR을 읽지 못했어요.'); }
};
document.getElementById('anonProtect').onclick = async function(){ if (await NU.protect()) document.getElementById('anonCard').classList.add('nu-hidden'); };
/* 🔴 2026-11-01 — 바로너를 첫 화면으로 고른 분: 앱이 켜지며 스스로 연락처로 옮겨도 되돌아오게(alias_contacts 맨 위) */
try { sessionStorage.setItem('burum_nureum_shown_at', String(Date.now())); } catch (e) {}
document.addEventListener('click', function(){ try { sessionStorage.setItem('burum_user_tap', String(Date.now())); } catch (e) {} }, true);

(async function(){
  var me = await NU.session();
  if (!me) {
    document.getElementById('meBtn').classList.add('nu-hidden');
    NU.showWelcome();
    return;
  }
  if (NU.isAnon(me)) document.getElementById('anonCard').classList.remove('nu-hidden');
  var grid = document.getElementById('grid');
  try {
    var lines = await NU.rpc('nureum_my_lines');
    NU.syncWidget(lines);   // 🔴 아이폰 위젯 목록 새로(끊긴 핫라인 빼기)
    if (!lines.length) { document.getElementById('empty').classList.remove('nu-hidden'); return; }
    /* 🔴 2026-11-03 — 앱 아이콘을 누르면 목록 대신 바로 "그 사람 전화 화면".
       [앱을 열면 이 사람부터]로 고른 사람, 없으면 짝 맺은 핫라인이 하나뿐일 때 그 사람. 앱을 켤 때 한 번만. */
    try {
      var app = (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) || !!window.AliasNative ||
                window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      var first = !sessionStorage.getItem('bn_launched'); sessionStorage.setItem('bn_launched', '1');
      if (app && first && !NU.q('list')) {
        var paired = lines.filter(function(l){ return l.link_id; });
        var homeId = localStorage.getItem('baronu_home_line');
        var t = paired.filter(function(l){ return l.id === homeId; })[0] || (paired.length === 1 ? paired[0] : null);
        if (t) { location.replace('nureum_line.html?line=' + t.id); return; }
      }
    } catch (e) {}
    grid.innerHTML = lines.map(function(l){
      var state = !l.link_id ? '짝 기다리는 중' : (!l.active ? (l.is_owner ? '이용권 필요' : '연장 필요') : '');
      var href = !l.link_id ? 'nureum_new.html?line=' + l.id : 'nureum_line.html?line=' + l.id;
      return '<a class="nu-tile" href="' + href + '">' +
        NU.icoHtml(l).replace('</span>', (state ? '<span class="tag">!</span>' : '') + '</span>') +
        '<b>' + NU.esc(l.name) + '</b>' + (state ? '<small>' + state + '</small>' : '') + '</a>';
    }).join('');
  } catch (e) {
    console.error(e);
    NU.showErr('err', '핫라인을 불러오지 못했습니다. ' + (e.message || e));
  }
})();
</script>
</body>
</html>
